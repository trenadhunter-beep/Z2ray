name: Build Z2ray APKs

on:
  push:
    tags:
      - 'v*'
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APKs (all ABIs + Universal)
        run: |
          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file=${{ secrets.KEYSTORE_PATH }} \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: List built APKs
        run: find app/build/outputs/apk -name "*.apk" | sort

      - name: Upload all APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Z2ray-APKs
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # Optional: Create GitHub Release and attach APKs (when tag is pushed)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Z2ray ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/Z2ray_*_arm64-v8a.apk
            app/build/outputs/apk/release/Z2ray_*_armeabi-v7a.apk
            app/build/outputs/apk/release/Z2ray_*_x86.apk
            app/build/outputs/apk/release/Z2ray_*_x86_64.apk
            app/build/outputs/apk/release/Z2ray_*_universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}