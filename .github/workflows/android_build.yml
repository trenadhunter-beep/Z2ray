name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      core:
        description: 'Bundled core flavor'
        required: false
        default: 'xray'
        type: choice
        options:
          - xray
          - v2fly

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    env:
      CORE_FLAVOR: ${{ github.event.inputs.core || 'xray' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-disabled: true

      - name: Create empty local secrets env
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "API_KEY=" > .env
          fi

      - name: Download Android core AAR
        run: |
          mkdir -p app/libs
          if [ "$CORE_FLAVOR" = "v2fly" ]; then
            CORE_URL="https://github.com/2dust/AndroidLibV2rayLite/releases/latest/download/libv2ray.aar"
          else
            CORE_URL="https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          fi
          echo "Using core flavor: $CORE_FLAVOR"
          curl -L --retry 3 --fail -o app/libs/libv2ray.aar "$CORE_URL"

      - name: Build debug APK
        run: gradle --stacktrace -PCORE_FLAVOR=$CORE_FLAVOR assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p release
          find app/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} release/ \;
          ls -lh release

      - name: Upload z2ray APKs
        uses: actions/upload-artifact@v4
        with:
          name: z2ray-${{ env.CORE_FLAVOR }}
          path: release/*.apk
          if-no-files-found: error
