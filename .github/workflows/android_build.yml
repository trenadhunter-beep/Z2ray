name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-disabled: true

      - name: Create empty local secrets env
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "API_KEY=" > .env
          fi

      - name: Download Xray core AAR
        run: |
          mkdir -p app/libs
          curl -L --retry 3 --fail -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar

      - name: Download Xray routing assets
        run: |
          mkdir -p app/src/main/assets
          curl -L --retry 3 --fail -o app/src/main/assets/geoip.dat https://github.com/Loyalsoldier/geoip/releases/latest/download/geoip.dat
          curl -L --retry 3 --fail -o app/src/main/assets/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Rename APK to z2ray.apk
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/z2ray.apk

      - name: Upload z2ray APK
        uses: actions/upload-artifact@v4
        with:
          name: z2ray
          path: release/z2ray.apk
          if-no-files-found: error
