name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, example v1.0.0'
        required: true
        type: string
      core:
        description: 'Bundled core flavor'
        required: true
        default: 'xray'
        type: choice
        options:
          - xray
          - v2fly
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    env:
      CORE_FLAVOR: ${{ github.event.inputs.core }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-disabled: false

      - name: Verify signing secrets are configured
        run: |
          test -n "${{ secrets.KEYSTORE_BASE64 }}" || (echo "KEYSTORE_BASE64 secret is required for official releases" && exit 1)
          test -n "${{ secrets.STORE_PASSWORD }}" || (echo "STORE_PASSWORD secret is required" && exit 1)
          test -n "${{ secrets.KEY_ALIAS }}" || (echo "KEY_ALIAS secret is required" && exit 1)
          test -n "${{ secrets.KEY_PASSWORD }}" || (echo "KEY_PASSWORD secret is required" && exit 1)

      - name: Create empty local secrets env
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else echo "API_KEY=" > .env; fi

      - name: Download Android core AAR
        run: |
          mkdir -p app/libs checksums
          if [ "$CORE_FLAVOR" = "v2fly" ]; then
            CORE_URL="https://github.com/2dust/AndroidLibV2rayLite/releases/latest/download/libv2ray.aar"
          else
            CORE_URL="https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          fi
          echo "Using core flavor: $CORE_FLAVOR"
          curl -L --retry 3 --fail -o app/libs/libv2ray.aar "$CORE_URL"
          sha256sum app/libs/libv2ray.aar | tee checksums/libv2ray-${CORE_FLAVOR}.aar.sha256

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --stacktrace -PCORE_FLAVOR=$CORE_FLAVOR clean test assembleRelease

      - name: Collect APK and checksums
        run: |
          mkdir -p release
          find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} release/ \;
          for APK in release/*.apk; do sha256sum "$APK" | tee "$APK.sha256"; done
          git rev-parse HEAD > release/source-commit.txt
          cp checksums/*.sha256 release/
          ls -lh release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: z2ray-${{ env.CORE_FLAVOR }}-signed-release
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: release/*
